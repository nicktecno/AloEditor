<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#080a10" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8257e5" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#04d361" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2438" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111522" stop-opacity="0.9" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="360" fill="url(#bgGrad)" />

  <!-- Subtle Modern Studio Grid -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="0" y1="90" x2="640" y2="90" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="270" x2="640" y2="270" />
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="320" cy="180" r="140" fill="#8257e5" opacity="0.15" filter="url(#neonGlow)" />
  <circle cx="320" cy="180" r="90" fill="#06b6d4" opacity="0.18" filter="url(#neonGlow)" />

  <!-- Top / Bottom Film Strip Accent Bars -->
  <rect x="0" y="0" width="640" height="12" fill="rgba(0, 0, 0, 0.6)" />
  <g fill="rgba(255, 255, 255, 0.15)">
    <rect x="20" y="2" width="12" height="8" rx="2" />
    <rect x="52" y="2" width="12" height="8" rx="2" />
    <rect x="84" y="2" width="12" height="8" rx="2" />
    <rect x="116" y="2" width="12" height="8" rx="2" />
    <rect x="148" y="2" width="12" height="8" rx="2" />
    <rect x="180" y="2" width="12" height="8" rx="2" />
    <rect x="212" y="2" width="12" height="8" rx="2" />
    <rect x="244" y="2" width="12" height="8" rx="2" />
    <rect x="276" y="2" width="12" height="8" rx="2" />
    <rect x="308" y="2" width="12" height="8" rx="2" />
    <rect x="340" y="2" width="12" height="8" rx="2" />
    <rect x="372" y="2" width="12" height="8" rx="2" />
    <rect x="404" y="2" width="12" height="8" rx="2" />
    <rect x="436" y="2" width="12" height="8" rx="2" />
    <rect x="468" y="2" width="12" height="8" rx="2" />
    <rect x="500" y="2" width="12" height="8" rx="2" />
    <rect x="532" y="2" width="12" height="8" rx="2" />
    <rect x="564" y="2" width="12" height="8" rx="2" />
    <rect x="596" y="2" width="12" height="8" rx="2" />
  </g>
  <rect x="0" y="348" width="640" height="12" fill="rgba(0, 0, 0, 0.6)" />
  <g fill="rgba(255, 255, 255, 0.15)">
    <rect x="20" y="350" width="12" height="8" rx="2" />
    <rect x="52" y="350" width="12" height="8" rx="2" />
    <rect x="84" y="350" width="12" height="8" rx="2" />
    <rect x="116" y="350" width="12" height="8" rx="2" />
    <rect x="148" y="350" width="12" height="8" rx="2" />
    <rect x="180" y="350" width="12" height="8" rx="2" />
    <rect x="212" y="350" width="12" height="8" rx="2" />
    <rect x="244" y="350" width="12" height="8" rx="2" />
    <rect x="276" y="350" width="12" height="8" rx="2" />
    <rect x="308" y="350" width="12" height="8" rx="2" />
    <rect x="340" y="350" width="12" height="8" rx="2" />
    <rect x="372" y="350" width="12" height="8" rx="2" />
    <rect x="404" y="350" width="12" height="8" rx="2" />
    <rect x="436" y="350" width="12" height="8" rx="2" />
    <rect x="468" y="350" width="12" height="8" rx="2" />
    <rect x="500" y="350" width="12" height="8" rx="2" />
    <rect x="532" y="350" width="12" height="8" rx="2" />
    <rect x="564" y="350" width="12" height="8" rx="2" />
    <rect x="596" y="350" width="12" height="8" rx="2" />
  </g>

  <!-- Central Card -->
  <rect x="170" y="65" width="300" height="220" rx="20" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
  
  <!-- Sleek Glowing Border Line on Card Top -->
  <line x1="200" y1="65" x2="440" y2="65" stroke="url(#neonGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Center Play Badge Circle -->
  <circle cx="320" cy="155" r="42" fill="rgba(10, 14, 26, 0.85)" stroke="url(#neonGrad)" stroke-width="2.5" filter="url(#subtleGlow)" />
  
  <!-- Play Triangle Icon -->
  <polygon points="312,138 338,155 312,172" fill="#06b6d4" />

  <!-- Title & Subtitle -->
  <text x="320" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    VÍDEO CLIP
  </text>
  <text x="320" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
    ALÔ EDITOR • PREVIEW
  </text>

  <!-- Corner Badges -->
  <g transform="translate(30, 26)">
    <rect width="64" height="22" rx="4" fill="rgba(6, 182, 212, 0.16)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" />
    <text x="32" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">
      16:9 HD
    </text>
  </g>

  <g transform="translate(546, 26)">
    <rect width="64" height="22" rx="4" fill="rgba(130, 87, 229, 0.16)" stroke="rgba(130, 87, 229, 0.4)" stroke-width="1" />
    <text x="32" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#c084fc" text-anchor="middle" letter-spacing="0.5">
      MÍDIA
    </text>
  </g>
</svg>
